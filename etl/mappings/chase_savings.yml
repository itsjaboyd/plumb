# Chase savings CSV export. Same layout as checking, different account.
name: chase_savings

account:
  name: Chase Savings
  type: Savings
  purpose: Emergency fund
  institution: Chase
  last4: "8901"

csv:
  encoding: utf-8-sig
  delimiter: ","

columns:
  posted_on: Posting Date
  description: Description
  amount: Amount
  balance: Balance

date_format:
  - "%m/%d/%Y"

amount:
  mode: signed
  flip_sign: false
