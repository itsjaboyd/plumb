[project]
name = "plumb"
version = "0.1.0"
description = "CSV transform and load layer for Plumb"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.1", "PyYAML>=6.0"]

[project.scripts]
plumb = "plumb.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["plumb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
